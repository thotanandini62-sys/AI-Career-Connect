{% extends 'base.html' %}

{% block page_title %}Sign In{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 3rem auto;" class="glass-card">
    <h2 style="font-family: var(--font-heading); text-align: center; margin-bottom: 0.5rem;">Welcome Back</h2>
    <p style="color: var(--text-muted); text-align: center; font-size: 0.9rem; margin-bottom: 1.5rem;">Sign in to access your AI Career Connect platform</p>

    <form method="POST" action="{{ url_for('auth.login') }}">
        <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;">Username or Email</label>
        <input type="text" name="username" class="form-control" placeholder="john@example.com or johndoe" required>

        <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem;">Sign In</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
        Don't have an account yet? <a href="{{ url_for('auth.register') }}" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">Register here</a>
    </div>
</div>
{% endblock %}
