{% extends 'base.html' %}

{% block page_title %}Create Account{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 2rem auto;" class="glass-card">
    <h2 style="font-family: var(--font-heading); text-align: center; margin-bottom: 0.5rem;">Join AI Career Connect</h2>
    <p style="color: var(--text-muted); text-align: center; font-size: 0.9rem; margin-bottom: 1.5rem;">Create your profile for Mistral AI career coaching</p>

    <form method="POST" action="{{ url_for('auth.register') }}">
        <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;">Full Name</label>
        <input type="text" name="full_name" class="form-control" placeholder="John Doe" required>

        <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;">Username</label>
        <input type="text" name="username" class="form-control" placeholder="johndoe" required>

        <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="john@example.com" required>

        <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;">Target Job Title / Role</label>
        <input type="text" name="target_role" class="form-control" placeholder="Senior AI Engineer" required>

        <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem;">Create Profile</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
        Already registered? <a href="{{ url_for('auth.login') }}" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">Sign In</a>
    </div>
</div>
{% endblock %}
